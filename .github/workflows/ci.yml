name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "charts/gate-cloud/files/dashboard/tests/*.test.mjs"
      - uses: azure/setup-helm@v4
      - name: Lint and render the chart
        run: |
          helm repo add dagster https://dagster-io.github.io/helm
          helm dependency build charts/gate-cloud
          helm lint charts/gate-cloud --set monitorDeviceId=ci --set dagster.postgresql.postgresqlPassword=ci
          helm template ci charts/gate-cloud --set monitorDeviceId=ci --set dagster.postgresql.postgresqlPassword=ci > /dev/null
          # Now that the dependency is built, the rendered dashboard ConfigMap and mount are checked too.
          uv run pytest -q tests/test_chart.py

  image:
    needs: test
    runs-on: ubuntu-latest
    # The cluster stores runs, events and schedules in Postgres; unit tests
    # use sqlite. Open the built image's instance on a real one before pushing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagster
          POSTGRES_PASSWORD: dagster
          POSTGRES_DB: dagster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dagster"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t gate-cloud:ci .
      - name: Smoke test on Postgres
        run: |
          docker run --rm --network host \
            -v "$PWD/ci/postgres-smoke/dagster.yaml:/opt/dagster/dagster_home/dagster.yaml:ro" \
            -v "$PWD/ci/postgres-smoke/check.py:/tmp/check.py:ro" \
            gate-cloud:ci python /tmp/check.py
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        if: github.event_name == 'push'
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
