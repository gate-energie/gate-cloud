{{- if not .Values.monitorDeviceId }}
{{- fail "monitorDeviceId is required: the ThingsFlow id of the Refoss monitor" }}
{{- end }}
{{- if and .Values.dagster.postgresql.enabled (not .Values.dagster.postgresql.postgresqlPassword) }}
{{- fail "dagster.postgresql.postgresqlPassword is required; pass it with --set, not in a values file" }}
{{- end }}
# Fixed names on purpose: the Dagster subchart references them literally
# (values.yaml, dagster-user-deployments), and subchart values cannot be
# templated. One GATE release per namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-cloud-env
  labels:
    app.kubernetes.io/name: gate-cloud
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  THINGSFLOW_URL: {{ .Values.thingsflow.url | quote }}
  GATE_MONITOR_DEVICE_ID: {{ .Values.monitorDeviceId | quote }}
  GATE_ASSET_MODEL_PATH: /etc/gate-cloud/asset_model.yaml
  GATE_DASHBOARD_PATH: /etc/gate-cloud/dashboard
  THINGSFLOW_INGEST_URL: {{ .Values.thingsflow.ingestUrl | quote }}
  GATE_ASSET_HISTORY: {{ .Values.assetHistory | toString | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-cloud-asset-model
  labels:
    app.kubernetes.io/name: gate-cloud
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  asset_model.yaml: |
{{- default (.Files.Get "files/asset_model.yaml") .Values.assetModel | nindent 4 }}
---
# The dashboard template directory, one key per file. Keys cannot hold "/":
# widgets/power_flow.js is stored as widgets__power_flow.js and mounted back at
# its path by the items in values.yaml (dagster-user-deployments volumes).
# tests/ stays out of the chart's ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-cloud-dashboard
  labels:
    app.kubernetes.io/name: gate-cloud
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- range $glob := list "files/dashboard/dashboard.json" "files/dashboard/theme.css" "files/dashboard/widgets/*.js" }}
{{- range $path, $_ := $.Files.Glob $glob }}
  {{ trimPrefix "files/dashboard/" $path | replace "/" "__" }}: |
{{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
