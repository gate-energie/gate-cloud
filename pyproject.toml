[project]
name = "gate-cloud"
version = "0.2.2"
description = "GATE energy asset operations on top of ThingsFlow, orchestrated with Dagster."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "dagster==1.13.25",
    "dagster-k8s==0.29.25",
    "dagster-postgres==0.29.25",
    # SQLAlchemy 2.1 maps postgresql:// to psycopg (v3); dagster-postgres ships
    # and uses psycopg2. Stay on 2.0 rather than mixing two drivers.
    "sqlalchemy>=2.0,<2.1",
    "tb-rest-client==4.3",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "dagster-webserver==1.13.25",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gate_cloud"]

[tool.dagster]
module_name = "gate_cloud.definitions"
code_location_name = "gate_cloud"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    # Dagster marks BackfillPolicy (used by weather_observations) as beta; it is emitted from Dagster internals.
    "ignore:Parameter `backfill_policy` of function `asset` is currently in beta:dagster.BetaWarning",
]
