[project]
name = "gate-cloud"
version = "0.1.0"
description = "GATE energy asset operations on top of ThingsFlow, orchestrated with Dagster."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "dagster==1.13.25",
    "dagster-k8s==0.29.25",
    "dagster-postgres==0.29.25",
    "tb-rest-client==4.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "dagster-webserver==1.13.25",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gate_cloud"]

[tool.dagster]
module_name = "gate_cloud.definitions"
code_location_name = "gate_cloud"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
